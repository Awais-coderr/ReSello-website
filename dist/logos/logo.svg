<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: R letter inside rounded square -->
  <rect x="0" y="4" width="52" height="52" rx="14" ry="14" fill="url(#iconGrad)" />

  <!-- Arrow up-right (resell concept) -->
  <polyline points="14,38 14,22 30,22" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="14" y1="22" x2="38" y2="42" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polyline points="26,42 38,42 38,30" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: Re -->
  <text x="64" y="42" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#FF8C00" letter-spacing="-0.5">Re</text>

  <!-- Wordmark: Sello -->
  <text x="100" y="42" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#1a1a1a" letter-spacing="-0.5">Sello</text>

  <!-- Dot accent under Re -->
  <circle cx="71" cy="50" r="2.5" fill="#FF8C00" />
  <circle cx="82" cy="50" r="2.5" fill="#FF8C00" />
</svg>
